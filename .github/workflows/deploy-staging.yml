name: Publicar staging (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vertical-adoracao-staging
  cancel-in-progress: false
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Criar configuracao exclusiva de staging
        env:
          STAGING_D1_DATABASE_ID: ${{ secrets.STAGING_D1_DATABASE_ID }}
        run: |
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("wrangler.staging.example.jsonc","utf8"));if(!process.env.STAGING_D1_DATABASE_ID)throw Error("STAGING_D1_DATABASE_ID ausente");c.d1_databases[0].database_id=process.env.STAGING_D1_DATABASE_ID;fs.writeFileSync("wrangler.staging.jsonc",JSON.stringify(c,null,2))'
          node scripts/verify-staging-target.mjs wrangler.staging.jsonc
      - name: Validar codigo e migracoes locais
        run: |
          npm run db:local
          npm test
          npx wrangler deploy --dry-run --config wrangler.staging.jsonc --outdir /tmp/staging-build
      - name: Aplicar migracoes somente no D1 staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply louvor-staging --remote --config wrangler.staging.jsonc
      - name: Publicar somente Worker staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.staging.jsonc
