name: Validacao automatizada
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-staging-config.mjs
      - run: node scripts/check-local-only.mjs
      - run: npm run db:local
      - run: npm run seed:local
      - run: npm test
        env:
          RUN_D1_INTEGRATION: '1'
      - run: npx wrangler deploy --dry-run --outdir /tmp/vertical-adoracao-build
      - run: node scripts/prepare-staging-config.mjs
      - run: npx wrangler deploy --config wrangler.staging.jsonc --dry-run --outdir /tmp/vertical-adoracao-staging-build
      - name: Install Chromium test tooling
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Chromium logout smoke test (local Worker only)
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/vertical-chromium-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/login > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/login > /dev/null
          node scripts/check-logout-chromium.mjs
