name: Browser smoke local - Modulo 3
on:
  workflow_dispatch:
  push:
    branches:
      - feat/modulo3-presencas-indicadores
    paths:
      - 'src/**'
      - 'scripts/run-browser-smoke.mjs'
      - '.github/workflows/modulo3-browser-local.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar Playwright sem alterar lockfile
        run: npm install --no-save --package-lock=false playwright
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Navegador real com D1 local temporario
        run: node scripts/run-browser-smoke.mjs
